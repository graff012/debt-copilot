services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: debt
      POSTGRES_PASSWORD: debt
      POSTGRES_DB: debtcopilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debt -d debtcopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
